spring:
  application:
    name: inventory

  datasource:
    url: jdbc:postgresql://localhost:5433/inventory
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 25
      minimum-idle: 12
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true

  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: inventory-group

server:
  port: 8082