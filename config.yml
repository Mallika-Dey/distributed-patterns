receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317   # REQUIRED
      http:
        endpoint: 0.0.0.0:4318   # REQUIRED
processors:
  batch:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80

  resourcedetection:
    detectors: [system, env]
    system:
      hostname_sources: [os]

  resource:
    attributes:
      - key: deployment.environment
        value: prod
        action: upsert

exporters:
  elasticsearch:
    endpoints: ["${ELASTICSEARCH_URL}"]
    logs_index: otel-logs
    traces_index: otel-traces
    mapping:
      mode: ecs

  debug:

extensions:
  health_check:

service:
  extensions: [health_check]

  pipelines:

    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [elasticsearch]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [elasticsearch, debug]
