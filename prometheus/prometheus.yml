global:
  scrape_interval: 10s

scrape_configs:

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "payment-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - payment-service-otel:8080
  
  - job_name: "order-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
        - order-service-otel:8080
