server:
  port: 8082

spring:
  application:
    name: discount-service

  datasource:
    url: jdbc:postgresql://localhost:5432/discount
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:29092
#
#flowable:
#  event-registry:
#    check-event-definitions: true

flowable:
  eventregistry:
    enabled: true

logging:
  level:
    org.flowable: INFO
    org.flowable.eventregistry: DEBUG